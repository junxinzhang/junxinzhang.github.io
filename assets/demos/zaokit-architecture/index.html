<title>Zaokit AI 产品架构 · 产品能力架构示意</title>
<style>
  :root{--bg:#09090B;--panel:#0C0C0F;--line:#27272A;--dim:#71717A;--mute:#A1A1AA;--text:#E4E4E7;--acc:#A78BFA}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text)}
  body{font-family:"SF Mono",Menlo,"JetBrains Mono",Consolas,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",monospace;min-height:100vh}
  .wrap{width:min(1600px, calc(100vw - 32px), calc((100vh - 92px) * 1.4545));min-width:min(1120px, calc(100vw - 24px));margin:0 auto;padding:14px 0 18px}
  .bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin:0 0 10px}
  .seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--panel)}
  .seg button,.ctl button{font:inherit;font-size:14px;color:var(--mute);background:transparent;border:0;padding:8px 14px;cursor:pointer;display:flex;align-items:center;gap:8px;white-space:nowrap}
  .seg button+button{border-left:1px solid var(--line)}
  .seg button i{width:8px;height:8px;background:var(--c);display:inline-block}
  .seg button:hover,.ctl button:hover{color:var(--text);background:#18181B}
  .seg button[aria-pressed="true"]{color:#FAFAFA;background:#18181B;box-shadow:inset 0 -2px 0 var(--c,#A78BFA)}
  .ctl{display:flex;gap:8px}
  .ctl button{border:1px solid var(--line);border-radius:6px;background:var(--panel)}
  .ctl button[aria-pressed="true"]{color:#FCD34D;border-color:#FCD34D66}
  button:focus-visible,[role=button]:focus-visible{outline:2px solid #A78BFA;outline-offset:2px}
  .hint{margin:0 0 0 auto;font-size:13px;color:var(--dim)}
  .scroller{overflow-x:auto;overflow-y:hidden;border-radius:14px;-webkit-overflow-scrolling:touch;position:relative}
  .stage{min-width:1120px}
  .stage svg{display:block;width:100%;height:auto}
  .scroll-hint{display:none;margin:0 0 8px;padding:8px 12px;font-size:13px;color:#FCD34D;border:1px dashed #FCD34D66;border-radius:6px;text-align:center}
  .overflow .scroll-hint{display:block}
  @media (max-width: 760px){.hint{display:none}.wrap{padding:10px 0;width:calc(100vw - 20px)}.seg{flex-wrap:wrap;max-width:100%}.seg button{padding:8px 10px}}

  /* ---------- diagram states ---------- */
  #arch .node{transition:opacity .35s}
  #arch .node .frame{transition:stroke-opacity .3s, stroke .3s}
  #arch .product{cursor:pointer}
  #arch .product:hover .frame{stroke-opacity:1;stroke-width:1.8}
  #arch .wire,#arch #layers,#arch .route{transition:opacity .35s, stroke-opacity .35s}
  #arch.dimmed .node:not(.on){opacity:.3}
  #arch.dimmed .wire{opacity:.22}
  #arch.dimmed #layers{opacity:.55}
  #arch .node.on .frame{stroke:var(--c);stroke-opacity:1;stroke-width:1.8;filter:drop-shadow(0 0 6px color-mix(in srgb, var(--c) 45%, transparent))}
  #arch .node.on .frame-c{stroke:var(--acc)}
  #arch .cap .cap-t{transition:fill .3s}
  #arch .cap.on .cap-t{fill:var(--c);font-weight:600}
  #arch .route.path{stroke:var(--acc);stroke-opacity:.2}
  #arch .route.on{stroke:var(--acc);stroke-opacity:.95}
  #arch .route.gov{stroke-dasharray:6 6}
  #arch .route.combo{stroke-dasharray:3 4}
  #arch .dot .halo{opacity:.35}
  #st-cursor{animation:blink 1.1s steps(1) infinite}
  .paused #st-cursor{animation:none}
  @keyframes blink{50%{opacity:0}}
  @media (prefers-reduced-motion: reduce){#st-cursor{animation:none}}
</style>
</head>

    {n:['edu'], c:['cap-edu-1'], r:[['r-ai-edu']], tag:'企业实战', text:'Zaokit AI Education 结合真实业务设计课程', dur:2.0},
    {c:['cap-edu-2'], tag:'教学学习', text:'理解 AI 工具的用法、适用场景与边界', dur:1.8},
    {n:['cowork','ppt','combo-1','combo-2'], c:['cap-edu-3'], r:[['r-edu-cowork'],['r-cowork-ppt']], tag:'实践训练', text:'在 Cowork / AI PPT 中动手完成真实任务', dur:2.4},
    {n:['hub'], c:['cap-hub-2'], r:[['r-hub-app']], tag:'Token Hub', text:'可为学员团队分配练习额度（可选）', dur:2.0},
    {n:['o-learn'], r:[['r-edu-out']], tag:'产出', text:'沉淀为学习实践成果', dur:2.0},
    {tag:'说明', text:'Education 是学习赋能，不是 PPT 请求的必经环节', dur:2.2},
  ]},
};

// ---------------------------------------------------------------- product details
const ENTR = p => ['com','app','ai'].map(e => `r-${e}-${p}`);
const INFO = {
  ppt: {name:'Zaokit AI PPT', lines:[
    ['定位','从内容到演示的创作工具，可独立使用'],
    ['能力','内容梳理 · 大纲生成 · 演示创作'],
    ['组合','可承接 Cowork 的资料分析结果；经 Gateway 按需调用文本、图像等模型能力'],
    ['产出','演示文稿']],
    n:['en-com','en-app','en-ai','gw','o-deck','combo-1'], r:[...ENTR('ppt'),'r-ppt-gw','r-ppt-out','r-ppt-cowork','r-hub-app']},
  cowork: {name:'Zaokit Cowork', lines:[
    ['定位','面向实际工作的 AI 协作工具，可独立使用'],
    ['能力','资料分析 · 文件处理 · 任务协作'],
    ['组合','分析结果可按需交给 AI PPT 制作汇报；经 Gateway 调用模型能力'],
    ['产出','工作成果']],
    n:['en-com','en-app','en-ai','gw','o-work','combo-1','combo-2'], r:[...ENTR('cowork'),'r-cowork-gw','r-cowork-out','r-cowork-ppt','r-edu-cowork','r-hub-app']},
  edu: {name:'Zaokit AI Education', lines:[
    ['定位','学习与应用赋能：帮助团队从听懂到会用'],
    ['能力','企业实战 · 教学学习 · 实践训练'],
    ['组合','实践训练可结合 Cowork / AI PPT 完成真实任务'],
    ['说明','不是 AI PPT 请求的运行环节；产出为学习实践']],
    n:['en-com','en-app','en-ai','o-learn','combo-2','cowork'], r:[...ENTR('edu'),'r-edu-cowork','r-edu-out','r-hub-app']},
  gw: {name:'Zaokit AI Gateway', lines:[
    ['定位','能力接入层：让应用以统一方式接入外部 AI 模型能力'],
    ['能力','统一模型接入 · 多模型与服务连接'],
    ['连接','上接 AI PPT、Cowork 等应用；下接文本推理 / 图像生成 / 语音能力'],
    ['说明','模型能力为通用类别示意，不代表具体厂商或部署方式']],
    n:['ppt','cowork','m-text','m-img','m-voice'], r:['r-ppt-gw','r-cowork-gw','r-gw-text','r-gw-img','r-gw-voice','r-hub-gw']},
  hub: {name:'Zaokit Token Hub', lines:[
    ['定位','治理面：团队用量、额度与成本的统一视图'],
    ['能力','团队用量 · 额度分配 · 成本可视'],
    ['关系','以虚线旁路连接应用层与 Gateway；不代理内容，也不是调用必经环节'],
    ['适合','需要管理 AI 使用额度与成本的团队和企业']],
    n:['ppt','cowork','edu','gw'], r:['r-hub-app','r-hub-gw']},
};

// ---------------------------------------------------------------- ambient chains (总览)
const AMBIENT = [
  [['r-ind-app'],['r-app-ppt'],['r-ppt-gw'],['r-gw-text']],
  [['r-team-com'],['r-com-cowork'],['r-cowork-gw'],['r-gw-img']],
  [['r-ent-ai'],['r-ai-edu'],['r-edu-out']],
  [['r-gw-voice',1],['r-cowork-gw',1],['r-cowork-out']],
  [['r-gw-img',1],['r-ppt-gw',1],['r-ppt-out']],
  [['r-team-app'],['r-app-cowork'],['r-cowork-ppt']],
  [['r-hub-app']], [['r-hub-gw',1]],
  [['r-ind-com'],['r-com-ppt']],
  [['r-ent-app'],['r-app-edu'],['r-edu-cowork']],
];
const KIND_COL = {call:'#C4B5FD', gov:'#93C5FD', combo:'#A1A1AA'};

// ---------------------------------------------------------------- state
const routes = {};
svg.querySelectorAll('.route').forEach(p => routes[p.id] = {el:p, len:p.getTotalLength(), kind:p.classList[1]});
const dotsG = $('dots');
const NS = 'http://www.w3.org/2000/svg';
const logEl = $('log'), logStatic = logEl.innerHTML;
const S = {mode:'overview', paused:false, t:0, step:-1, stepT:0, focus:null, dots:[], nextSpawn:0, log:[]};

function makeDot(color){
  const g = document.createElementNS(NS, 'g'); g.setAttribute('class','dot');
  g.innerHTML = `<circle class="halo" r="7" fill="${color}" filter="url(#glow)"/><circle r="2.8" fill="${color}"/>`;
  dotsG.appendChild(g); return g;
}
function spawn(segs, start, color, speed){
  // segs: [[id, rev, dur?]]
  const list = segs.filter(s => routes[s[0]]).map(s => ({id:s[0], rev:!!s[1], dur: s[2] || Math.max(.55, routes[s[0]].len / (speed || 170))}));
  if (!list.length) return;
  const total = list.reduce((a, s) => a + s.dur, 0);
  S.dots.push({segs:list, start, total, el:makeDot(color || KIND_COL[routes[list[0].id].kind] || '#C4B5FD')});
}
function renderDots(){
  S.dots = S.dots.filter(d => {
    let e = S.t - d.start;
    if (e > d.total){ d.el.remove(); return false; }
    if (e < 0){ d.el.setAttribute('visibility','hidden'); return true; }
    d.el.removeAttribute('visibility');
    for (const s of d.segs){
      if (e <= s.dur){
        const r = routes[s.id], k = e / s.dur, ease = k < .5 ? 2*k*k : 1 - Math.pow(-2*k + 2, 2) / 2;
        const p = r.el.getPointAtLength((s.rev ? 1 - ease : ease) * r.len);
        d.el.setAttribute('transform', `translate(${p.x.toFixed(1)},${p.y.toFixed(1)})`);
        break;
      }
      e -= s.dur;
    }
    return true;
  });
}
function clearDots(){ S.dots.forEach(d => d.el.remove()); S.dots = []; }
function clearLit(){
  svg.querySelectorAll('.on,.path').forEach(el => el.classList.remove('on','path'));
  svg.classList.remove('dimmed');
}

// ---------------------------------------------------------------- log + status
const logLines = [0,1,2,3].map(i => $('log-'+i));
function setLog(title, sub, rows, color){
  if (!$('log-title')){ logEl.innerHTML = logStatic; logLines.splice(0, 4, ...[0,1,2,3].map(i => $('log-'+i))); }
  $('log-title').textContent = title; $('log-sub').textContent = '  · ' + sub;
  logLines.forEach((el, i) => {
    const r = rows[i], [a, b, c] = el.children;
    a.textContent = r ? r[0] : ''; b.textContent = r ? r[1] : ''; c.textContent = r ? r[2] : '';
    b.setAttribute('fill', r && r[3] ? r[3] : color);
  });
}
function restoreStaticLog(){ logEl.innerHTML = logStatic; logLines.splice(0, 4, ...[0,1,2,3].map(i => $('log-'+i))); }
function status(){
  const cmd = S.focus ? ` inspect --product ${S.focus}` : (S.mode === 'overview' ? ' explore --view overview' : ` play --scenario ${S.mode}`);
  $('st-cmd').textContent = cmd;
  $('st-scn').textContent = S.focus ? INFO[S.focus].name : NAME[S.mode];
  $('st-play').textContent = S.paused ? '已暂停' : '播放中';
  const tx = $('st-cmd').parentNode; const bb = tx.getBBox();
  $('st-cursor').setAttribute('x', (bb.x + bb.width + 6).toFixed(1));
  document.body.classList.toggle('paused', S.paused);
  const pb = $('btn-pause'); pb.textContent = S.paused ? '▶ 继续' : '⏸ 暂停'; pb.setAttribute('aria-pressed', S.paused);
  document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === S.mode && !S.focus));
}

// ---------------------------------------------------------------- modes
function setMode(m){
  S.focus = null; S.mode = m; S.step = -1; S.stepT = S.t; S.log = []; S.nextSpawn = S.t;
  clearDots(); clearLit();
  if (m === 'overview'){ restoreStaticLog(); }
  else {
    const sc = SC[m]; svg.style.setProperty('--acc', COL[m]); svg.classList.add('dimmed');
    sc.steps.forEach(st => (st.r || []).forEach(([id]) => routes[id] && routes[id].el.classList.add('path')));
    setLog('演示事件', `${NAME[m]} · 概念旅程示意，非实时监控`, [['', '准备', '即将播放该场景的概念路径', '#71717A']], COL[m]);
  }
  status(); render();
}
function applyStep(sc, i, t0){
  const st = sc.steps[i];
  (st.n || []).forEach(id => $('n-'+id) && $('n-'+id).classList.add('on'));
  (st.c || []).forEach(id => $(id) && $(id).classList.add('on'));
  (st.r || []).forEach(([id, rev]) => { if (!routes[id]) return; routes[id].el.classList.add('on'); spawn([[id, rev, st.dur * .8]], t0, COL[S.mode]); });
  S.log.push([String(i + 1).padStart(2, '0'), st.tag, st.text]);
  setLog('演示事件', `${NAME[S.mode]} · 概念旅程示意，非实时监控`, S.log.slice(-4), COL[S.mode]);
}
function advance(){
  const sc = SC[S.mode], n = sc.steps.length;
  for (let guard = 0; guard < 50; guard++){
    const d = S.step < 0 ? .5 : (S.step < n ? sc.steps[S.step].dur : 3.2);
    if (S.t - S.stepT < d) return;
    S.stepT += d; S.step++;
    if (S.step < n) applyStep(sc, S.step, S.stepT);
    else if (S.step > n){ // 循环
      clearLit(); svg.classList.add('dimmed');
      sc.steps.forEach(st => (st.r || []).forEach(([id]) => routes[id] && routes[id].el.classList.add('path')));
      S.step = -1; S.log = [];
    }
  }
}
function setFocus(id){
  if (S.focus === id || !id){ const m = S.mode; S.focus = null; setMode(m); return; }
  clearDots(); clearLit();
  S.focus = id; S.nextSpawn = S.t;
  const f = INFO[id];
  svg.style.setProperty('--acc', COL[id]); svg.classList.add('dimmed');
  $('n-'+id).classList.add('on');
  f.n.forEach(n => $('n-'+n) && $('n-'+n).classList.add('on'));
  svg.querySelectorAll(`#n-${id} .cap`).forEach(c => c.classList.add('on'));
  f.r.forEach(r => routes[r] && routes[r].el.classList.add('on'));
  setLog('产品详情', `${f.name} · 再次点击或按 Esc 返回`, f.lines.map(([k, v]) => ['›', k, v, COL[id]]), COL[id]);
  status(); render();
}

// ---------------------------------------------------------------- loop
function tick(dt){
  if (S.paused) return;
  S.t += dt;
  if (S.focus){
    if (S.t >= S.nextSpawn){ const r = INFO[S.focus].r; spawn([[r[Math.floor(Math.random()*r.length)], Math.random() < .3]], S.nextSpawn, COL[S.focus]); S.nextSpawn += .45; }
  } else if (S.mode === 'overview'){
    if (S.t >= S.nextSpawn){ spawn(AMBIENT[Math.floor(Math.random()*AMBIENT.length)], S.nextSpawn); S.nextSpawn += .7; }
  } else advance();
}
function render(){ renderDots(); }
let last = null;
function frame(ts){
  if (last !== null) tick(Math.min(.05, (ts - last) / 1000));
  last = ts; render(); requestAnimationFrame(frame);
}

// ---------------------------------------------------------------- controls
document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));
function togglePause(){ S.paused = !S.paused; status(); }
$('btn-pause').addEventListener('click', togglePause);
$('btn-replay').addEventListener('click', () => { S.paused = false; S.focus ? setFocus(S.focus) : setMode(S.mode); status(); });
svg.querySelectorAll('.product').forEach(g => {
  const id = g.dataset.id;
  g.addEventListener('click', e => { e.stopPropagation(); setFocus(id); });
  g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); e.stopPropagation(); setFocus(id); } });
});
svg.addEventListener('click', () => { if (S.focus) setFocus(null); });
document.addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('button,[role=button]') && (e.key === ' ' || e.key === 'Enter')) return;
  if (e.key === ' '){ e.preventDefault(); togglePause(); }
  else if (e.key === 'Escape' && S.focus) setFocus(null);
  else if ('1234'.includes(e.key) && e.key.length === 1) setMode(['overview','ppt','cowork','edu'][+e.key - 1]);
});
const scroller = $('scroller'), wrap = $('wrap');
function checkOverflow(){ wrap.classList.toggle('overflow', scroller.scrollWidth > scroller.clientWidth + 2); }
addEventListener('resize', checkOverflow);

// ---------------------------------------------------------------- init (#s=ppt&t=8&paused=1&focus=gw)
const hp = new URLSearchParams(location.hash.slice(1));
if (matchMedia('(prefers-reduced-motion: reduce)').matches) S.paused = false;
setMode(SC[hp.get('s')] ? hp.get('s') : 'overview');
const seek = parseFloat(hp.get('t') || '0');
for (let k = 0; k < seek * 30; k++) tick(1/30);
if (INFO[hp.get('focus')]) setFocus(hp.get('focus'));
if (hp.get('paused') === '1') S.paused = true;
status(); render(); checkOverflow();
const SELFTEST = new URLSearchParams(location.search).has('selftest');
if (!SELFTEST) requestAnimationFrame(frame);

// ---------------------------------------------------------------- self test (?selftest)
if (SELFTEST) (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => {
  const R = {errors:[], checks:0};
  const fail = m => R.errors.push(m);
  const inside = (a, b, pad = 0) => a.x >= b.x - pad && a.y >= b.y - pad && a.x + a.width <= b.x + b.width + pad && a.y + a.height <= b.y + b.height + pad;
  const label = el => (el.id || el.textContent || el.tagName).slice(0, 40);
  setMode('overview'); clearDots();
  // 1. 全部元素在画布内
  const canvas = {x:0, y:0, width:1600, height:1100};
  svg.querySelectorAll('text,rect,path,circle,line').forEach(el => {
    if (el.closest('defs') || el.closest('#dots')) return;
    const b = el.getBBox(); R.checks++;
    if (!inside(b, canvas)) fail('out of canvas: ' + label(el));
  });
  // 2. 卡片内文字不越界
  svg.querySelectorAll('[data-box]').forEach(g => {
    const fb = g.querySelector('.frame').getBBox();
    g.querySelectorAll('text').forEach(tx => { R.checks++; if (!inside(tx.getBBox(), fb, -3)) fail(`text overflow in ${g.id}: ${tx.textContent}`); });
  });
  // 3. 文本互不重叠（静态与每种动态文案）
  const overlapCheck = tag => {
    const ts = [...svg.querySelectorAll('text')].filter(t => t.textContent.trim()).map(t => [t, t.getBBox()]);
    for (let i = 0; i < ts.length; i++) for (let j = i + 1; j < ts.length; j++){
      const a = ts[i][1], b = ts[j][1]; R.checks++;
      if (a.x < b.x + b.width - 1 && b.x < a.x + a.width - 1 && a.y < b.y + b.height - 3 && b.y < a.y + a.height - 3)
        fail(`[${tag}] text overlap: "${label(ts[i][0])}" × "${label(ts[j][0])}"`);
    }
    // 日志行在日志框内
    const lb = logEl.querySelector('rect').getBBox();
    logLines.forEach(l => { R.checks++; if (l.textContent.trim() && !inside(l.getBBox(), lb, -4)) fail(`[${tag}] log overflow: ${l.textContent}`); });
    const sb = $('st-cmd').parentNode.getBBox(), sr = svg.querySelector('#status text[text-anchor=end]').getBBox();
    R.checks++; if (sb.x + sb.width + 20 > sr.x) fail(`[${tag}] status bar overlap`);
  };
  overlapCheck('overview');
  // 4. 路径
  Object.entries(routes).forEach(([id, r]) => { R.checks++; if (!(r.len > 10)) fail('bad route ' + id); });
  Object.values(SC).forEach(sc => sc.steps.forEach(st => {
    (st.r || []).forEach(([id]) => { R.checks++; if (!routes[id]) fail('missing route ' + id); });
    [...(st.n || []).map(n => 'n-' + n), ...(st.c || [])].forEach(id => { R.checks++; if (!$(id)) fail('missing node ' + id); });
  }));
  Object.values(INFO).forEach(f => { f.r.forEach(id => { R.checks++; if (!routes[id]) fail('missing focus route ' + id); });
    f.n.forEach(id => { R.checks++; if (!$('n-' + id)) fail('missing focus node ' + id); }); });
  // 5. 控件：场景按钮
  document.querySelectorAll('.seg button').forEach(b => {
    b.click(); R.checks++;
    const m = b.dataset.mode;
    if (S.mode !== m || b.getAttribute('aria-pressed') !== 'true' || $('st-scn').textContent !== NAME[m]) fail('scenario button ' + m);
    if (m !== 'overview'){
      const sc = SC[m]; let total = .5; sc.steps.forEach(s => total += s.dur);
      for (let k = 0; k < (total - sc.steps[sc.steps.length-1].dur / 2) * 30; k++) tick(1/30);
      render(); R.checks++;
      if (S.step !== sc.steps.length - 1) fail(`scenario ${m} reached step ${S.step}`);
      if (!svg.classList.contains('dimmed') || !svg.querySelector('.route.on')) fail('scenario highlight ' + m);
      if (S.dots.length === 0 && sc.steps[sc.steps.length-1].r) fail('no dots ' + m);
      overlapCheck(m);
      for (let k = 0; k < 4.6 * 30; k++) tick(1/30); // 循环
      R.checks++; if (S.step > 0) fail('scenario loop ' + m);
    }
  });
  // 6. 暂停/继续
  setMode('ppt'); for (let k = 0; k < 90; k++) tick(1/30);
  const pb = $('btn-pause'); pb.click(); const t0 = S.t; for (let k = 0; k < 30; k++) tick(1/30);
  R.checks++; if (!S.paused || S.t !== t0 || $('st-play').textContent !== '已暂停' || !pb.textContent.includes('继续')) fail('pause');
  pb.click(); tick(1/30); R.checks++; if (S.paused || S.t === t0 || !pb.textContent.includes('暂停')) fail('resume');
  $('btn-replay').click(); R.checks++; if (S.step !== -1 || S.mode !== 'ppt') fail('replay');
  // 7. 产品聚焦
  svg.querySelectorAll('.product').forEach(g => {
    g.dispatchEvent(new MouseEvent('click', {bubbles:true})); R.checks++;
    const id = g.dataset.id;
    if (S.focus !== id || !$('log-sub').textContent.includes(INFO[id].name) || !g.classList.contains('on')) fail('focus ' + id);
    for (let k = 0; k < 30; k++) tick(1/30);
    R.checks++; if (!S.dots.length) fail('focus dots ' + id);
    overlapCheck('focus-' + id);
  });
  document.dispatchEvent(new KeyboardEvent('keydown', {key:'Escape'})); R.checks++;
  if (S.focus) fail('escape unfocus');
  document.dispatchEvent(new KeyboardEvent('keydown', {key:'3'})); R.checks++;
  if (S.mode !== 'cowork') fail('key 3');
  document.dispatchEvent(new KeyboardEvent('keydown', {key:' '})); R.checks++;
  if (!S.paused) fail('space pause');
  setMode('overview'); S.paused = false; status();
  const pre = document.createElement('pre'); pre.id = 'selftest';
  pre.textContent = JSON.stringify({pass: !R.errors.length, checks: R.checks, errors: R.errors}, null, 1);
  document.body.appendChild(pre);
  document.title = 'SELFTEST:' + (R.errors.length ? 'FAIL' : 'PASS');
});
})();
</script>
</body>
