<!-- Hybrid CJK + English Site Search - Lazy loaded on user interaction -->
<style>
    .nav-search-item {
        position: relative;
        display: flex;
        align-items: center;
    }
    .nav-search-toggle {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border: 1px solid rgba(0, 0, 0, 0.1);
        background: rgba(0, 0, 0, 0.025);
        border-radius: 999px;
        padding: 0.28rem 0.65rem !important;
        cursor: pointer;
        color: inherit;
        transition: background-color 0.18s ease, border-color 0.18s ease;
    }
    .nav-search-toggle:hover {
        background: rgba(3, 168, 124, 0.08);
        border-color: rgba(3, 168, 124, 0.35);
    }
    .nav-search-toggle:focus {
        outline: 2px solid #03a87c;
        outline-offset: 2px;
    }
    .nav-search-kbd {
        font-size: 0.7rem;
        font-weight: 600;
        line-height: 1;
        padding: 2px 5px;
        border-radius: 4px;
        opacity: 0.65;
        font-family: var(--font-family-monospace, monospace);
    }
    [data-theme="dark"] .nav-search-toggle {
        border-color: rgba(255, 255, 255, 0.14);
        background: rgba(255, 255, 255, 0.04);
        color: var(--text-color, #e6edf3);
    }
    [data-theme="dark"] .nav-search-toggle:hover {
        background: rgba(3, 168, 124, 0.16);
        border-color: rgba(63, 208, 164, 0.45);
    }

    .nav-search-form {
        display: none;
        margin: 0;
    }

    @media (max-width: 991.98px) {
        .nav-search-item {
            width: 100%;
            margin-top: 0.4rem;
        }
        .nav-search-toggle {
            display: none;
        }
        .nav-search-form {
            display: block;
            width: 100%;
        }
        .nav-search-form .form-control {
            width: 100%;
            border-radius: 999px;
            height: 2.25rem;
            font-size: 0.92rem;
        }
    }

    /* Command-Palette Search Modal */
    #lunrsearchresults {
        display: none;
    }
    .jj-search-backdrop {
        position: fixed;
        inset: 0;
        z-index: 2050;
        background: rgba(15, 23, 42, 0.55);
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: 8vh 16px 24px;
        overflow-y: auto;
    }
    .jj-search-dialog {
        width: 100%;
        max-width: 680px;
        background: #ffffff;
        color: #1f2937;
        border-radius: 14px;
        border: 1px solid rgba(0, 0, 0, 0.08);
        box-shadow: 0 22px 50px -12px rgba(0, 0, 0, 0.28);
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }
    .jj-search-header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 14px 16px;
        border-bottom: 1px solid #eef0f3;
    }
    .jj-search-icon {
        color: #03a87c;
        flex-shrink: 0;
    }
    .jj-search-input {
        flex: 1;
        border: 0 !important;
        outline: none !important;
        box-shadow: none !important;
        background: transparent !important;
        font-size: 1.02rem;
        line-height: 1.4;
        color: inherit;
        padding: 2px 0;
        min-width: 0;
    }
    .jj-search-input::-webkit-search-cancel-button {
        -webkit-appearance: none;
        appearance: none;
    }
    .jj-search-clear {
        border: 0;
        background: rgba(0, 0, 0, 0.06);
        color: #6b7280;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        line-height: 1;
        cursor: pointer;
        padding: 0;
        flex-shrink: 0;
    }
    .jj-search-clear:hover {
        background: rgba(0, 0, 0, 0.12);
        color: #111827;
    }
    .jj-search-esc {
        border: 1px solid #e5e7eb;
        background: #f9fafb;
        color: #6b7280;
        border-radius: 6px;
        padding: 3px 7px;
        font-size: 0.72rem;
        font-weight: 600;
        cursor: pointer;
        flex-shrink: 0;
    }
    .jj-search-esc:hover {
        background: #f3f4f6;
        color: #111827;
    }
    .jj-search-meta {
        padding: 7px 18px;
        font-size: 0.78rem;
        color: #6b7280;
        background: #f9fafb;
        border-bottom: 1px solid #eef0f3;
    }
    .jj-search-body {
        max-height: min(62vh, 500px);
        overflow-y: auto;
        overscroll-behavior: contain;
    }
    .jj-search-list {
        list-style: none !important;
        margin: 0 !important;
        padding: 6px !important;
    }
    .jj-result-item {
        list-style: none !important;
        margin: 2px 0;
    }
    .jj-result-link {
        display: block;
        padding: 11px 13px;
        border-radius: 9px;
        border-left: 3px solid transparent;
        text-decoration: none !important;
        color: inherit !important;
        transition: background-color 0.12s ease, border-color 0.12s ease;
    }
    .jj-result-link:hover,
    .jj-result-link.active {
        background: rgba(3, 168, 124, 0.07);
        border-left-color: #03a87c;
    }
    .jj-result-top {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 4px;
        font-size: 0.74rem;
    }
    .jj-badge {
        display: inline-block;
        padding: 1px 7px;
        border-radius: 999px;
        font-weight: 600;
        font-size: 0.7rem;
        background: rgba(3, 168, 124, 0.12);
        color: #028a66;
    }
    .jj-badge-project {
        background: rgba(120, 50, 226, 0.12);
        color: #6d28d9;
    }
    .jj-badge-report {
        background: rgba(245, 158, 11, 0.15);
        color: #b45309;
    }
    .jj-badge-page {
        background: rgba(59, 130, 246, 0.12);
        color: #1d4ed8;
    }
    .jj-result-date {
        color: #9ca3af;
        font-variant-numeric: tabular-nums;
    }
    .jj-result-tag {
        color: #6b7280;
        font-size: 0.72rem;
    }
    .jj-result-title {
        font-size: 0.97rem;
        font-weight: 600;
        line-height: 1.42;
        color: #111827;
    }
    .jj-result-snippet {
        margin-top: 4px;
        font-size: 0.83rem;
        line-height: 1.55;
        color: #4b5563;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
    }
    mark.search-hl {
        background: rgba(3, 168, 124, 0.18);
        color: #026e52;
        font-weight: 600;
        padding: 0 2px;
        border-radius: 3px;
    }
    .jj-empty-section {
        padding: 12px 12px 8px;
    }
    .jj-section-label,
    .jj-section-divider {
        font-size: 0.74rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        color: #9ca3af;
        margin-bottom: 8px;
    }
    .jj-section-divider {
        padding: 8px 12px 2px;
        margin-bottom: 2px;
        border-top: 1px solid #f1f3f5;
    }
    .jj-chips-wrap {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
    }
    .jj-chips-wrap.justify-center {
        justify-content: center;
    }
    .jj-chip {
        border: 1px solid #e5e7eb;
        background: #f9fafb;
        color: #374151;
        border-radius: 999px;
        padding: 4px 11px;
        font-size: 0.8rem;
        cursor: pointer;
        transition: all 0.15s ease;
    }
    .jj-chip:hover {
        background: #03a87c;
        border-color: #03a87c;
        color: #ffffff;
    }
    .jj-no-results {
        text-align: center;
        padding: 32px 20px 26px;
    }
    .jj-no-results-title {
        font-size: 1rem;
        font-weight: 600;
        color: #111827;
        margin-bottom: 6px;
    }
    .jj-no-results-hint {
        font-size: 0.84rem;
        color: #6b7280;
        margin-bottom: 16px;
    }
    .jj-loading-row {
        padding: 28px 16px;
        text-align: center;
        font-size: 0.88rem;
        color: #6b7280;
    }
    .jj-search-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 16px;
        border-top: 1px solid #eef0f3;
        background: #f9fafb;
        font-size: 0.74rem;
        color: #9ca3af;
    }
    .jj-hydrate-status {
        color: #03a87c;
    }

    /* Dark Mode Overrides */
    [data-theme="dark"] .jj-search-backdrop {
        background: rgba(2, 6, 14, 0.72);
    }
    [data-theme="dark"] .jj-search-dialog {
        background: #161b22;
        color: #e6edf3;
        border-color: #30363d;
        box-shadow: 0 24px 56px rgba(0, 0, 0, 0.65);
    }
    [data-theme="dark"] .jj-search-header {
        border-bottom-color: #262c36;
    }
    [data-theme="dark"] .jj-search-icon {
        color: #3fd0a4;
    }
    [data-theme="dark"] .jj-search-input {
        color: #e6edf3;
    }
    [data-theme="dark"] .jj-search-input::placeholder {
        color: #7d8590;
    }
    [data-theme="dark"] .jj-search-clear {
        background: rgba(255, 255, 255, 0.08);
        color: #8b949e;
    }
    [data-theme="dark"] .jj-search-clear:hover {
        background: rgba(255, 255, 255, 0.16);
        color: #f0f6fc;
    }
    [data-theme="dark"] .jj-search-esc {
        background: #21262d;
        border-color: #30363d;
        color: #8b949e;
    }
    [data-theme="dark"] .jj-search-esc:hover {
        background: #30363d;
        color: #f0f6fc;
    }
    [data-theme="dark"] .jj-search-meta {
        background: #0d1117;
        border-bottom-color: #262c36;
        color: #8b949e;
    }
    [data-theme="dark"] .jj-result-link:hover,
    [data-theme="dark"] .jj-result-link.active {
        background: rgba(63, 208, 164, 0.11);
        border-left-color: #3fd0a4;
    }
    [data-theme="dark"] .jj-badge {
        background: rgba(63, 208, 164, 0.16);
        color: #56f0c3;
    }
    [data-theme="dark"] .jj-badge-project {
        background: rgba(167, 139, 250, 0.18);
        color: #c4b5fd;
    }
    [data-theme="dark"] .jj-badge-report {
        background: rgba(251, 191, 36, 0.18);
        color: #fcd34d;
    }
    [data-theme="dark"] .jj-badge-page {
        background: rgba(96, 165, 250, 0.18);
        color: #93c5fd;
    }
    [data-theme="dark"] .jj-result-title {
        color: #f0f6fc;
    }
    [data-theme="dark"] .jj-result-snippet {
        color: #9ca3af;
    }
    [data-theme="dark"] .jj-result-date,
    [data-theme="dark"] .jj-result-tag {
        color: #7d8590;
    }
    [data-theme="dark"] mark.search-hl {
        background: rgba(63, 208, 164, 0.24);
        color: #6ef7ce;
    }
    [data-theme="dark"] .jj-section-divider {
        border-top-color: #262c36;
    }
    [data-theme="dark"] .jj-chip {
        background: #21262d;
        border-color: #30363d;
        color: #c9d1d9;
    }
    [data-theme="dark"] .jj-chip:hover {
        background: #03a87c;
        border-color: #03a87c;
        color: #ffffff;
    }
    [data-theme="dark"] .jj-no-results-title {
        color: #f0f6fc;
    }
    [data-theme="dark"] .jj-search-footer {
        background: #0d1117;
        border-top-color: #262c36;
        color: #7d8590;
    }
    [data-theme="dark"] .jj-hydrate-status {
        color: #3fd0a4;
    }

    @media (max-width: 575.98px) {
        .jj-search-backdrop {
            padding: 10px;
        }
        .jj-search-body {
            max-height: 70vh;
        }
        .jj-search-hint {
            display: none;
        }
    }
</style>

<li class="nav-item nav-search-item" id="navSearchItem">
    <button id="searchToggle" class="nav-link nav-search-toggle" type="button" aria-label="Open search (Cmd+K)"
        title="Search (⌘K / Ctrl+K)">
        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" fill="currentColor" viewBox="0 0 16 16"
            aria-hidden="true">
            <path
                d="M11.742 10.344a6.5 6.5 0 1 0-1.398 1.398h.001l3.85 3.85a1 1 0 0 0 1.414-1.415l-3.85-3.85zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z" />
        </svg>
        <span class="nav-search-kbd">⌘K</span>
    </button>
    <form class="bd-search nav-search-form" role="search"
        onSubmit="return initSearchAndRun(document.getElementById('lunrsearch').value);">
        <label for="lunrsearch" class="sr-only">Search</label>
        <input type="search" class="form-control text-small" id="lunrsearch" name="q" value=""
            placeholder="Type and hit enter..." data-i18n="nav.search_placeholder" aria-label="Search site content"
            autocomplete="off">
    </form>
</li>

<script>
(function () {
    var engineLoaded = false;
    var engineLoading = false;
    var pendingCallbacks = [];
    var searchToggle = document.getElementById('searchToggle');
    var searchInput = document.getElementById('lunrsearch');

    // Adapt shortcut label for non-Apple devices
    var kbdEl = searchToggle && searchToggle.querySelector('.nav-search-kbd');
    if (kbdEl && navigator.platform && !/Mac|iPhone|iPod|iPad/i.test(navigator.platform)) {
        kbdEl.textContent = 'Ctrl K';
    }

    function loadSearchEngine(callback) {
        if (engineLoaded && window.JustJasonSearch) {
            if (callback) callback();
            return;
        }
        if (callback) pendingCallbacks.push(callback);
        if (engineLoading) return;
        engineLoading = true;

        var script = document.createElement('script');
        script.src = '{{ site.baseurl }}/assets/js/search-engine.js?v=20261113';
        script.onload = function () {
            engineLoaded = true;
            engineLoading = false;
            if (window.JustJasonSearch && window.JustJasonSearch.initBrowserSearch) {
                window.JustJasonSearch.initBrowserSearch({ baseUrl: '{{ site.baseurl }}' });
            }
            var cbs = pendingCallbacks.slice();
            pendingCallbacks = [];
            for (var i = 0; i < cbs.length; i++) cbs[i]();
        };
        script.onerror = function () {
            engineLoading = false;
            pendingCallbacks = [];
        };
        document.head.appendChild(script);
    }

    function openSearch(initialTerm) {
        loadSearchEngine(function () {
            if (window.openSearchModal) {
                window.openSearchModal(typeof initialTerm === 'string' ? initialTerm : undefined);
            }
        });
    }

    window.openNavbarSearch = function () {
        openSearch();
    };

    window.initSearchAndRun = function (term) {
        openSearch(term || '');
        return false;
    };

    if (searchToggle) {
        searchToggle.addEventListener('mouseenter', function () {
            loadSearchEngine();
        }, { once: true });

        searchToggle.addEventListener('click', function (e) {
            e.preventDefault();
            e.stopPropagation();
            openSearch();
        });
    }

    if (searchInput) {
        searchInput.addEventListener('focus', function () {
            openSearch(searchInput.value || '');
        });
    }

    document.addEventListener('keydown', function (e) {
        var isCmdK = (e.metaKey || e.ctrlKey) && e.key && e.key.toLowerCase() === 'k';
        if (isCmdK) {
            e.preventDefault();
            openSearch();
            return;
        }
        // Support '/' quick-open when focus is not inside an editable element
        if (e.key === '/' && !e.metaKey && !e.ctrlKey && !e.altKey) {
            var active = document.activeElement;
            var tag = active ? active.tagName : '';
            var isEditable = active && (active.isContentEditable || tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT');
            if (!isEditable) {
                e.preventDefault();
                openSearch();
            }
        }
    });
})();
</script>
